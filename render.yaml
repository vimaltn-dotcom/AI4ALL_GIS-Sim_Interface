services:
  - type: web
    name: ground-beneath-growth
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/tally
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
